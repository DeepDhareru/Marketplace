name: Deploy Marketplace

on:
  push:
    branches:
      - main

jobs:
  # ─── Backend Lint & Test ───────────────────────────
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Check for syntax errors
        run: node --check server.js

      - name: Verify all route files exist
        run: |
          echo "Checking route files..."
          test -f routes/authRoutes.js && echo "✅ authRoutes"
          test -f routes/productRoutes.js && echo "✅ productRoutes"
          test -f routes/orderRoutes.js && echo "✅ orderRoutes"
          test -f routes/cartRoutes.js && echo "✅ cartRoutes"
          test -f routes/adminRoutes.js && echo "✅ adminRoutes"
          test -f routes/aiRoutes.js && echo "✅ aiRoutes"
          echo "All route files verified!"

      - name: Verify all model files exist
        run: |
          echo "Checking model files..."
          test -f models/User.js && echo "✅ User model"
          test -f models/Product.js && echo "✅ Product model"
          test -f models/Order.js && echo "✅ Order model"
          test -f models/Cart.js && echo "✅ Cart model"
          echo "All model files verified!"

  # ─── Frontend Build ───────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Create .env for build
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
          echo "VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID }}" >> .env

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist && echo "✅ Build successful!" || echo "❌ Build failed!"

  # ─── Notify on Success ────────────────────────────
  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: success()

    steps:
      - name: Success message
        run: |
          echo "✅ All checks passed!"
          echo "🚀 Backend verified"
          echo "🎨 Frontend built successfully"
          echo "📦 Ready for deployment"